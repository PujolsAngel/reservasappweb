<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Gestiona reservas, agenda y equipo de tu negocio.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="TomarTurno">
  <link rel="apple-touch-icon" href="icons/Icon-maskable-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>TomarTurno</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#22282A">
  <style>
    html, body { margin: 0; background: #F8F7F4; }
    /* Pantalla de carga: se ve apenas llega el HTML, mientras se descarga el
       motor de Flutter (varios MB) — antes era una pantalla en blanco. Se
       quita sola cuando Flutter dibuja su primer cuadro. */
    #boot {
      position: fixed; inset: 0; z-index: 1;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 18px;
      background: #F8F7F4; transition: opacity .25s ease;
    }
    #boot.done { opacity: 0; pointer-events: none; }
    #boot img { width: 84px; height: 84px; border-radius: 20px; }
    #boot .ring {
      width: 26px; height: 26px; border-radius: 50%;
      border: 3px solid rgba(34, 40, 42, .14); border-top-color: #1D9E75;
      animation: boot-spin .8s linear infinite;
    }
    @keyframes boot-spin { to { transform: rotate(360deg); } }
    @media (prefers-color-scheme: dark) {
      html, body, #boot { background: #0D1A19; }
      #boot .ring { border-color: rgba(233, 240, 238, .16); border-top-color: #3ED8A0; }
    }
  </style>
</head>
<body>
  <div id="boot"><img src="icons/Icon-192.png" alt="TomarTurno"><div class="ring"></div></div>
  <script>
    // Quita la pantalla de carga cuando Flutter ya dibujó (o a los 20 s como
    // seguro, para que nunca tape la app si ese evento no llega).
    (function () {
      function hide() {
        var el = document.getElementById('boot');
        if (!el) return;
        el.classList.add('done');
        setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 400);
      }
      window.addEventListener('flutter-first-frame', hide);
      setTimeout(hide, 20000);
    })();
  </script>
  <script>
    // Flutter Web (con PathUrlStrategy) borra el "?..." de la URL apenas
    // arranca, antes de que el código Dart llegue a leerlo — esto corre
    // primero, en JS puro, y lo guarda para que pending_link.dart lo pueda
    // recuperar aunque la barra de direcciones ya se haya limpiado.
    (function () {
      try {
        if (window.location.search) {
          sessionStorage.setItem('__initial_search', window.location.search);
        }
      } catch (e) {}
    })();
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
